const NAMES={'0xec897071929657b898c18513ef85ec8a8f898ea3':'MempireArena','0xde510aa056ab8fa5b867ac9fef90a9c6cb37dc22':'MempireCards','0x17ca9e2102d2b38f3676fec6b5ea6c927753d148':'MarketMeta','0x4337084d9e255ff0702461cf8895ce9e3b5ff108':'EntryPoint v0.8','0xde9359912efcc3acf3cd4c5797353b106bf0be6c':'MempirePaymaster','0xfe140f43017caa1f201f9e1dc7989c1f70f45234':'$MEMPIRE','0xb9f79d863261869b234c481d1f9a7af84aead192':'CRE forwarder (simulation)'};
async function rpc(method,params){for(const u of RPCS){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});const j=await r.json();if(j.result!==undefined)return j.result}catch(e){}}throw new Error('rpc unavailable')}
const nm=a=>a?(NAMES[a.toLowerCase()]||a.slice(0,8)+'…'+a.slice(-4)):'—';
async function show(label,hash){
  const el=document.createElement('div');el.className='card';el.innerHTML='<h2>'+label+'</h2><div class="v">'+hash+'</div><p>reading…</p>';document.getElementById('list').appendChild(el);
  try{
    const [tx,rc]=await Promise.all([rpc('eth_getTransactionByHash',[hash]),rpc('eth_getTransactionReceipt',[hash])]);
    const evs=(rc.logs||[]).map(l=>TOPICS[l.topics[0]]||null).filter(Boolean);
    const type=parseInt(tx.type,16);
    el.innerHTML='<h2>'+label+'</h2><div class="kv">'
     +'<div class="k">status</div><div class="v '+(rc.status==='0x1'?'ok':'bad')+'">'+(rc.status==='0x1'?'✓ success':'✗ reverted')+'</div>'
     +'<div class="k">block</div><div class="v">'+parseInt(rc.blockNumber,16).toLocaleString('en-US')+'</div>'
     +'<div class="k">type</div><div class="v">'+type+(type===4?' · EIP-7702 (authorizations: '+(tx.authorizationList||[]).length+')':'')+'</div>'
     +'<div class="k">from → to</div><div class="v">'+nm(tx.from)+' → '+nm(tx.to)+'</div>'
     +'<div class="k">gas used</div><div class="v">'+parseInt(rc.gasUsed,16).toLocaleString('en-US')+'</div>'
     +'<div class="k">events</div><div>'+(evs.length?evs.map(e=>'<span class="ev">'+e+'</span>').join(''):'—')+'</div>'
     +'<div class="k">hash</div><div class="v"><a href="https://testnet.monadvision.com/tx/'+hash+'" target="_blank" rel="noopener">'+hash+'</a></div></div>';
  }catch(e){el.querySelector('p').textContent='Could not read: '+e.message}
}
const q=new URLSearchParams(location.search);
for(const item of (q.get('tx')||'').split(',').filter(Boolean)){const [label,hash]=item.split('~');show(decodeURIComponent(label),hash)}
</script></body></html>
