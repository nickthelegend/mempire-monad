<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lilita;src:url(../../app/node_modules/@fontsource/lilita-one/files/lilita-one-latin-400-normal.woff2)}
@font-face{font-family:Hanken;font-weight:800;src:url(../../app/node_modules/@fontsource/hanken-grotesk/files/hanken-grotesk-latin-800-normal.woff2)}
@font-face{font-family:Hanken;font-weight:600;src:url(../../app/node_modules/@fontsource/hanken-grotesk/files/hanken-grotesk-latin-600-normal.woff2)}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0d2a5c}
body{font-family:Hanken,sans-serif;color:#fff;
 background-color:#14418f;background-image:linear-gradient(135deg,rgba(255,255,255,.055) 25%,transparent 25%),linear-gradient(225deg,rgba(255,255,255,.055) 25%,transparent 25%),linear-gradient(45deg,rgba(0,0,0,.14) 25%,transparent 25%),linear-gradient(315deg,rgba(0,0,0,.14) 25%,transparent 25%),radial-gradient(120% 80% at 50% 0%,#2160c4,#0d2a5c 72%);
 background-size:92px 92px,92px 92px,92px 92px,92px 92px,100% 100%}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
.disp{font-family:Lilita;letter-spacing:1px;text-transform:uppercase;-webkit-text-stroke:6px #1b1030;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.35)}
.gold{background:linear-gradient(180deg,#fff2c4 4%,#ffe38a 30%,#ffc422 60%,#c58a06 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 6px 0 #1b1030) drop-shadow(0 0 2px #1b1030)}
.sub{font-weight:600;font-size:40px;opacity:.92;text-align:center;max-width:1300px;line-height:1.3}
@keyframes inout{0%{opacity:0;transform:scale(.92)}8%{opacity:1;transform:scale(1)}92%{opacity:1}100%{opacity:0}}
@keyframes slam{0%{transform:scale(2.4) rotate(-6deg);opacity:0}55%{transform:scale(.94) rotate(1deg);opacity:1}75%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes rise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
@keyframes fanin{from{transform:translateY(420px) rotate(0) scale(.6);opacity:0}to{opacity:1}}
@keyframes grow{from{width:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes pill{0%{background:#5b6b8c}30%{background:#2a7bf6}70%,100%{background:#14c47a}}
#s1{animation:inout 2.6s .1s both}
#s1 img{width:820px;animation:slam .9s .1s both}
#s1 .disp{font-size:84px;margin-top:10px;animation:rise .6s .6s both}
#s2{animation:inout 10.8s 2.4s both}
.fan{position:relative;width:1500px;height:560px;margin-bottom:40px}
.card{position:absolute;bottom:0;left:50%;width:250px;margin-left:-125px;border-radius:22px;border:6px solid #1b1030;box-shadow:0 18px 30px rgba(0,0,0,.45);animation:fanin .7s both}
.tags{display:flex;gap:22px}
.tag{font-family:Lilita;font-size:44px;padding:10px 28px;border-radius:999px;border:5px solid #1b1030;background:#ffc422;color:#1b1030;animation:rise .5s both}
#s3{animation:inout 6.6s 13.0s both}
.board{width:1100px;padding:34px 44px;border-radius:28px;border:6px solid #1b1030;background:linear-gradient(180deg,#9a6334,#6b3f1d);box-shadow:inset 0 3px 0 rgba(255,255,255,.25),0 16px 0 rgba(0,0,0,.3)}
.row{display:flex;align-items:center;gap:22px;padding:14px 18px;margin:12px 0;border-radius:16px;background:rgba(0,0,0,.28);font-size:40px;font-weight:800;animation:rise .5s both}
.row img{width:64px;height:64px;border-radius:12px;border:3px solid #1b1030;object-fit:cover}
.bar{height:22px;border-radius:999px;animation:grow 1s both}
#s4{animation:inout 6.2s 19.4s both}
.pills{display:flex;flex-direction:column;gap:22px;margin-top:40px}
.pillx{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:40px;padding:14px 30px;border-radius:999px;border:5px solid #1b1030;animation:pill 1.6s both}
#s5{animation:inout 5.4s 25.6s both}
.chips{display:flex;gap:16px;margin-top:44px}
.chip{width:150px;padding:14px 0;border-radius:16px;border:5px solid #1b1030;font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:30px;text-align:center;animation:rise .4s both}
</style></head><body><div class="scene" style="animation:inout 3.6s .05s both"><div class="disp" style="font-size:64px;animation:rise .4s .1s both">Best Mera-Powered UX</div><img src="../../app/public/art/logo.webp" style="width:620px;margin-top:20px;animation:slam .7s .2s both"><div class="sub" style="margin-top:20px;animation:rise .4s .6s both">A passkey is the whole account · Monad testnet</div></div></body></html>
